<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Password Policy Auditor</title><style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:850px;margin:40px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;background:#08131f;color:white;border:1px solid #345}.pass{color:#86efac}.fail{color:#fca5a5}a{color:#7dd3fc}</style></head><body><div class='box'><h1>📋 Password Policy Auditor</h1><p>Check a password against common policy requirements. Nothing is uploaded.</p><input id='p' type='password' placeholder='Enter password'><div id='r'></div><p><a href='../'>← Back to portfolio</a></p></div><script>p.oninput=()=>{let v=p.value,cs=[['Minimum 12 characters',v.length>=12],['Uppercase',/[A-Z]/.test(v)],['Lowercase',/[a-z]/.test(v)],['Number',/\d/.test(v)],['Special character',/[^A-Za-z0-9]/.test(v)],['No spaces',!/\s/.test(v)]];let ok=cs.every(x=>x[1]);r.innerHTML=`<h2 class='${ok?'pass':'fail'}'>${ok?'PASS':'NEEDS IMPROVEMENT'}</h2><ul>${cs.map(x=>`<li class='${x[1]?'pass':'fail'}'>${x[1]?'✓':'✗'} ${x[0]}</li>`).join('')}</ul>`}</script></body></html>
