<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Password Hash Demo</title><style>body{font-family:system-ui;background:#07111f;color:#eaf3ff;max-width:900px;margin:35px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #345;background:#08131f;color:white}button{cursor:pointer;background:#123b55}code{word-break:break-all}a{color:#7dd3fc}</style></head><body><div class='box'><h1>🔑 Offline Hash Matching Demo</h1><p>Educational browser demo for hashes you own. Uses a small user-provided word list only.</p><select id='alg'><option>SHA-256</option><option>SHA-1</option></select><input id='hash' placeholder='Paste target hash'><textarea id='words' rows='6'>password
admin
letmein
cybersecurity
hello123</textarea><button id='go'>Try Words</button><p id='out'>Ready.</p><p><a href='../'>← Back to portfolio</a></p></div><script>async function digest(a,t){let n=a==='SHA-256'?'SHA-256':'SHA-1',b=await crypto.subtle.digest(n,new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}go.onclick=async()=>{let target=hash.value.trim().toLowerCase(),ws=words.value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,100);out.textContent='Checking...';for(let x of ws){if(await digest(alg.value,x)===target){out.innerHTML='Match found: <b>'+x.replace(/[<>&]/g,'')+'</b>';return}}out.textContent='No match in this small demo word list.'}</script></body></html>
