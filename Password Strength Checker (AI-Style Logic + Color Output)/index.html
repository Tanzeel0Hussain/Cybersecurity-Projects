<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Password Strength Checker</title><style>body{font-family:system-ui;background:#07111f;color:#e8f0ff;max-width:850px;margin:40px auto;padding:20px}.box{background:#0e1b2d;border:1px solid #223653;border-radius:16px;padding:24px}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #345;background:#08131f;color:white}.bar{height:12px;background:#17283d;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#7dd3fc;transition:.2s}.ok{color:#86efac}.bad{color:#fca5a5}a{color:#7dd3fc}</style></head><body><div class='box'><h1>🔐 Password Strength Checker</h1><p>Browser-based version of the project. Your password stays in this browser.</p><input id='p' type='password' placeholder='Enter a password'><div class='bar'><div class='fill' id='f'></div></div><h2 id='score'>Strength: —</h2><ul id='rules'></ul><p><a href='../'>← Back to portfolio</a></p></div><script>const p=document.getElementById('p'),f=document.getElementById('f'),s=document.getElementById('score'),r=document.getElementById('rules');p.oninput=()=>{let v=p.value,checks=[['At least 12 characters',v.length>=12],['Uppercase letter',/[A-Z]/.test(v)],['Lowercase letter',/[a-z]/.test(v)],['Number',/\d/.test(v)],['Special character',/[^A-Za-z0-9]/.test(v)],['Avoid obvious patterns',!/password|123456|qwerty|admin/i.test(v)]];let n=checks.filter(x=>x[1]).length;f.style.width=(n/6*100)+'%';s.textContent='Strength: '+(['Very weak','Weak','Fair','Good','Strong','Excellent'][Math.max(0,n-1)]||'—');r.innerHTML=checks.map(x=>`<li class='${x[1]?'ok':'bad'}'>${x[1]?'✓':'✗'} ${x[0]}</li>`).join('')}};</script></body></html>
