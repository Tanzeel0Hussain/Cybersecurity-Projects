<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login Bruteforce Simulator</title><style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:900px;margin:35px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}input,button{padding:12px;border-radius:9px;border:1px solid #35506e;background:#08131f;color:white;margin:5px}button{cursor:pointer;background:#123b55}.log{background:#050c14;padding:14px;border-radius:10px;min-height:180px;white-space:pre-wrap}a{color:#7dd3fc}</style></head><body><div class='box'><h1>🧪 Login Attempt Simulator</h1><p>Safe local simulation only. It never contacts external accounts or websites.</p><p>Demo account: <b>student</b> / <b>Secure123!</b></p><input id='u' value='student'><input id='w' placeholder='Comma-separated demo guesses' value='123456,password,Secure123!'><button id='run'>Run Simulation</button><div class='log' id='log'>Ready.</div><p><a href='../'>← Back to portfolio</a></p></div><script>run.onclick=async()=>{let user=u.value.trim(),list=w.value.split(',').map(x=>x.trim()).filter(Boolean),out=[];log.textContent='';for(let i=0;i<Math.min(list.length,20);i++){await new Promise(r=>setTimeout(r,220));let ok=user==='student'&&list[i]==='Secure123!';out.push(`Attempt ${i+1}: ${list[i].replace(/./g,'•')} → ${ok?'MATCH':'failed'}`);log.textContent=out.join('\n');if(ok)break}}</script></body></html>
