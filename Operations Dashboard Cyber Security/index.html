<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SOC Operations Dashboard</title><style>body{font-family:system-ui;background:#050b14;color:#eaf3ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#0d1b2a;border:1px solid #29405c;border-radius:14px;padding:18px}.sev{color:#fca5a5}.ok{color:#86efac}table{width:100%;border-collapse:collapse;margin-top:16px;background:#0d1b2a}th,td{padding:11px;border-bottom:1px solid #29405c;text-align:left}button{padding:10px 14px;background:#123b55;color:white;border:1px solid #345;border-radius:8px;cursor:pointer}a{color:#7dd3fc}</style></head><body><div class='wrap'><h1>🖥️ SOC Operations Dashboard</h1><p>Interactive browser simulation using generated defensive security events.</p><div class='grid'><div class='card'><b>Open Alerts</b><h2 id='alerts'>4</h2></div><div class='card'><b>High Severity</b><h2 class='sev' id='high'>1</h2></div><div class='card'><b>Systems Online</b><h2 class='ok'>12/12</h2></div><div class='card'><b>Events Today</b><h2 id='events'>128</h2></div></div><p><button id='add'>Generate Simulated Event</button></p><table><thead><tr><th>Time</th><th>Source</th><th>Event</th><th>Severity</th></tr></thead><tbody id='rows'></tbody></table><p><a href='../'>← Back to portfolio</a></p></div><script>let data=[['09:12','Auth','Repeated failed login','Medium'],['09:28','Endpoint','Malware signature blocked','High'],['10:03','Firewall','Denied inbound connection','Low'],['10:17','Email','Suspicious attachment quarantined','Medium']];function draw(){rows.innerHTML=data.slice().reverse().map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('');alerts.textContent=data.filter(x=>x[3]!=='Low').length;high.textContent=data.filter(x=>x[3]==='High').length}add.onclick=()=>{let ev=[['Firewall','Blocked scan pattern','Medium'],['Auth','MFA challenge failed','Low'],['Endpoint','Suspicious process contained','High'],['Email','Phishing link reported','Medium']],x=ev[Math.floor(Math.random()*ev.length)],d=new Date();data.push([d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),...x]);events.textContent=Number(events.textContent)+1;draw()};draw()</script></body></html>
