<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Log Analyzer</title><style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:980px;margin:30px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}textarea,button,input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #345;background:#08131f;color:white}button{background:#123b55;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#08131f;padding:15px;border-radius:10px}a{color:#7dd3fc}</style></head><body><div class='box'><h1>📊 Blue Team Log Analyzer</h1><p>Paste authentication logs or load a text log file. Analysis happens locally in your browser.</p><input type='file' id='file' accept='.log,.txt'><textarea id='t' rows='12' placeholder='Paste logs here...'></textarea><button id='an'>Analyze</button><div class='grid' id='g'></div><p><a href='../'>← Back to portfolio</a></p></div><script>file.onchange=async()=>{if(file.files[0])t.value=await file.files[0].text()};an.onclick=()=>{let x=t.value,lines=x.split(/\n/).filter(Boolean),fail=lines.filter(l=>/failed|failure|invalid|denied/i.test(l)),ips=[...x.matchAll(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g)].map(m=>m[0]),c={};ips.forEach(i=>c[i]=(c[i]||0)+1);let top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x.join(' × ')).join('<br>')||'None';g.innerHTML=`<div class='card'><b>Total lines</b><h2>${lines.length}</h2></div><div class='card'><b>Failed/auth alerts</b><h2>${fail.length}</h2></div><div class='card'><b>Unique IPs</b><h2>${Object.keys(c).length}</h2></div><div class='card'><b>Top IPs</b><p>${top}</p></div>`}</script></body></html>
