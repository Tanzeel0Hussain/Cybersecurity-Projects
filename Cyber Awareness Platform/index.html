<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Cyber Awareness Platform</title><style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:900px;margin:30px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}.q{margin:18px 0;padding:14px;background:#08131f;border-radius:10px}button{padding:12px 18px;background:#123b55;color:white;border:1px solid #345;border-radius:9px;cursor:pointer}a{color:#7dd3fc}</style></head><body><div class='box'><h1>🛡️ Cyber Awareness Assessment</h1><p>Answer the questions to receive a simple security-awareness score.</p><form id='f'><div id='qs'></div><button>Calculate Score</button></form><h2 id='out'></h2><p><a href='../'>← Back to portfolio</a></p></div><script>let q=[['Do you use unique passwords for important accounts?',1],['Do you enable multi-factor authentication where available?',1],['Do you verify suspicious links before opening them?',1],['Do you keep your software and device updated?',1],['Do you regularly back up important data?',1]];qs.innerHTML=q.map((x,i)=>`<div class='q'><b>${i+1}. ${x[0]}</b><br><label><input required type='radio' name='q${i}' value='1'> Yes</label> &nbsp; <label><input type='radio' name='q${i}' value='0'> No</label></div>`).join('');f.onsubmit=e=>{e.preventDefault();let n=q.reduce((s,_,i)=>s+Number(new FormData(f).get('q'+i)),0),pct=n/q.length*100;out.textContent=`Awareness score: ${pct}% — ${pct>=80?'Strong habits':pct>=60?'Good start; improve weak areas':'Several habits need attention'}`}</script></body></html>
