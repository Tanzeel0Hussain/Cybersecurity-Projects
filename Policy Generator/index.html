<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Cybersecurity Policy Generator</title><style>body{font-family:system-ui;background:#07111f;color:#edf6ff;max-width:950px;margin:30px auto;padding:20px}.box{background:#0d1b2a;padding:24px;border-radius:16px;border:1px solid #29405c}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #345;background:#08131f;color:white}button{background:#123b55;cursor:pointer}.doc{white-space:pre-wrap;background:#fff;color:#111;padding:22px;border-radius:10px;margin-top:18px}a{color:#7dd3fc}</style></head><body><div class='box'><h1>📑 Cybersecurity Policy Generator</h1><p>Create a starter policy draft directly in your browser.</p><input id='org' placeholder='Organization name'><select id='type'><option>Small Business</option><option>University / Education</option><option>Technology Company</option><option>General Organization</option></select><input id='owner' placeholder='Policy owner / role'><button id='gen'>Generate Policy</button><div class='doc' id='doc'>Your draft will appear here.</div><p><a href='../'>← Back to portfolio</a></p></div><script>gen.onclick=()=>{let o=org.value.trim()||'Organization',r=owner.value.trim()||'Security Team';doc.textContent=`${o} — Cybersecurity Policy Starter\n\n1. Purpose\nProtect information, systems and users from avoidable cybersecurity risk.\n\n2. Scope\nApplies to employees, contractors, accounts, devices and data used by ${o}.\n\n3. Access Control\nUse least privilege, unique accounts and multi-factor authentication where available.\n\n4. Passwords\nUse strong unique passwords and approved password managers.\n\n5. Updates & Protection\nKeep operating systems, applications and security tools updated.\n\n6. Data Handling\nStore and share sensitive data only through approved services.\n\n7. Incident Reporting\nReport suspected phishing, malware, account compromise or data exposure immediately.\n\n8. Backups\nMaintain tested backups for critical information.\n\nPolicy owner: ${r}\nOrganization type: ${type.value}\n\nThis is an educational starter template, not legal or compliance advice.`}</script></body></html>
